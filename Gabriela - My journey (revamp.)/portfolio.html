.smooth {
  width:12.5em;
  color:#ffffff;
  font-size:2em;
  font-weight:800;
  line-height:1.5em;
  white-space:nowrap;
  overflow:hidden;
  animation: typing 4s infinite,
  blink .5s step-end infinite alternate-reverse,
  hue_color 4s infinite alternate-reverse;
  filter:hue-rotate(0deg);
}

@keyframes hue_color {
  0% {
    filter: hue_rotate(180deg);
  }
  100% {
    filter: hue_rotate(360deg);
  }
}

@keyframes typing {
    0% {
        width:0ch;
    }
    50% {
        width:12.5em;
    }
    100% {
      width: 0;
    }
}


@keyframes blink {
  50% {
    border-color:transparent;
  }
}
